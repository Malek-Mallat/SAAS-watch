<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · SaaSWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="login-wrap px-3">
  <div class="card" style="width: 100%; max-width: 380px;">
    <div class="card-body p-4">
      <h1 class="h4 mb-1"><i class="bi bi-activity text-primary"></i> SaaSWatch</h1>
      <p class="text-muted small mb-4">Monitoring des logs d'une application SaaS</p>
      <div id="erreur" class="alert alert-danger d-none py-2"></div>
      <form id="form-login">
        <div class="mb-3">
          <label class="form-label" for="username">Nom d'utilisateur</label>
          <input class="form-control" id="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Mot de passe</label>
          <input class="form-control" id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit" id="btn">Se connecter</button>
      </form>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
  if (SW.token()) window.location.href = "/";
  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("erreur");
    const btn = document.getElementById("btn");
    err.classList.add("d-none");
    btn.disabled = true;
    try {
      const res = await fetch("/api/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.erreur || "Connexion impossible");
      SW.save(data.token, data.utilisateur);
      window.location.href = "/";
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.remove("d-none");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
