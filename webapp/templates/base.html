<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SaaSWatch{% endblock %} · SaaSWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  {% block head %}{% endblock %}
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-activity"></i> SaaSWatch</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if page == 'accueil' %}active{% endif %}" href="/"><i class="bi bi-speedometer2"></i> Accueil</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'import' %}active{% endif %}" href="/import"><i class="bi bi-cloud-arrow-up"></i> Import</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'recherche' %}active{% endif %}" href="/recherche"><i class="bi bi-search"></i> Recherche</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'historique' %}active{% endif %}" href="/historique"><i class="bi bi-clock-history"></i> Historique</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/dashboard"><i class="bi bi-bar-chart-line"></i> Dashboard Kibana</a></li>
        <li class="nav-item"><a class="nav-link" href="/apidocs" target="_blank"><i class="bi bi-braces"></i> API</a></li>
      </ul>
      <span class="navbar-text me-3"><i class="bi bi-person-circle"></i> <span id="sw-user"></span></span>
      <button class="btn btn-outline-light btn-sm" onclick="SW.logout()"><i class="bi bi-box-arrow-right"></i> Déconnexion</button>
    </div>
  </div>
</nav>

<main class="container-fluid px-4 pb-5">
  <div id="zone-alerte"></div>
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>SW.requireLogin();</script>
{% block scripts %}{% endblock %}
</body>
</html>
